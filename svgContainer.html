<!DOCTYPE html>
<html lang="en">

<head>
    <title>SVG ICON CONTAINER</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --neon-pink: #ff00ff;
            --neon-blue: #00ffff;
            --neon-purple: #9d00ff;
            --neon-green: #00ff9d;
            --dark-bg: #0f0f1a;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--dark-bg);
            color: white;
            overflow-x: hidden;
        }

        .neon-glow {
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px var(--neon-blue), 0 0 20px var(--neon-blue);
        }

        .neon-box {
            box-shadow: 0 0 5px var(--neon-blue), 0 0 15px var(--neon-blue);
        }

        .neon-pink {
            box-shadow: 0 0 5px var(--neon-pink), 0 0 15px var(--neon-pink);
        }

        .neon-purple {
            box-shadow: 0 0 5px var(--neon-purple), 0 0 15px var(--neon-purple);
        }

        .neon-green {
            box-shadow: 0 0 5px var(--neon-green), 0 0 15px var(--neon-green);
        }

        .sidebar {
            background: rgba(15, 15, 26, 0.9);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(0, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .sidebar-item {
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }

        .sidebar-item:hover,
        .sidebar-item.active {
            background: rgba(0, 255, 255, 0.1);
            border-left: 3px solid var(--neon-blue);
        }

        .header {
            background: rgba(15, 15, 26, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
        }

        .search-bar {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .search-bar:focus {
            box-shadow: 0 0 5px var(--neon-blue), 0 0 15px var(--neon-blue);
            border: 1px solid var(--neon-blue);
        }

        .content-section {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            display: none;
        }

        .content-section.active {
            opacity: 1;
            transform: translateY(0);
            display: block;
        }

        .clock {
            font-weight: 300;
            letter-spacing: 1px;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 5px var(--neon-blue), 0 0 10px var(--neon-blue);
            }

            50% {
                box-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
            }

            100% {
                box-shadow: 0 0 5px var(--neon-blue), 0 0 10px var(--neon-blue);
            }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        .textarea-neon,
        .file-input-label {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .textarea-neon:focus {
            box-shadow: 0 0 5px var(--neon-blue), 0 0 15px var(--neon-blue);
            border: 1px solid var(--neon-blue);
        }

        .file-input {
            display: none;
        }

        .file-input-label:hover {
            box-shadow: 0 0 5px var(--neon-purple), 0 0 15px var(--neon-purple);
            border: 1px solid var(--neon-purple);
        }

        .notification-badge {
            background-color: var(--neon-pink);
            position: absolute;
            top: -5px;
            right: -5px;
        }

        svg {
            max-width: 100px;
            max-height: 100px;
            border: 1px solid #ddd;
            margin: 20px;
            padding: 10px;
        }
    </style>
</head>

<header class="header fixed top-0 left-0 right-0 h-16 z-50 flex items-center justify-between px-4">

        <button id="sidebar-toggle" class="mr-4 text-white hover:text-cyan-400 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"

    </div>

        <div class="relative">
            <button type="button" class="text-white hover:text-cyan-400 transition-colors">

            <span class="text-sm font-bold">JB</span>

    </div>
</header>
