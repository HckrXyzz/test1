  1: "https://workflow-media-assets-1.s3.amazonaws.com/uploads/",

function imgUrl(id) {
  if (!id) return "";
  if (id.startsWith("1/")) return S3[1] + id.slice(2);
  if (id.startsWith("2/")) return S3[2] + id.slice(2);
  if (id.startsWith("3/")) return S3[3] + id.slice(2);
  if (id.startsWith("g/"))
    return "https://lh3.googleusercontent.com/d/" + id.slice(2);
  return id;
}

/* ────────────────────────────────────────────────
   Build records
──────────────────────────────────────────────── */
const records = RAW.trim()
  .split("\n")
  .map((line) => {
    const [ref, amount, img, status] = line.split("|");
    return {
      ref: (ref || "").trim(),
      amount: (amount || "").trim(),
      img: imgUrl((img || "").trim()),
      status: (status || "").trim(),
    };
  });

const esc = (s) =>
  String(s).replace(
    /[&<>"']/g,
    (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[
        c
      ],
  );
const num = (v) => parseInt(String(v).replace(/[^0-9]/g, ""), 10) || 0;

const tbody = document.getElementById("rows");
const emptyEl = document.getElementById("empty");
const countEl = document.getElementById("count");
const totalEl = document.getElementById("total");
const searchEl = document.getElementById("search");

const COPY_ICON = `<svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
  <rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>`;
const DONE_ICON = `<svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
  <path d="m5 13 4 4L19 7"/></svg>`;

function render(list) {
  let html = "";
  let total = 0;

  list.forEach((r, i) => {
    total += num(r.amount);
    const badge = r.status
      ? `<span class="inline-flex items-center rounded-full bg-amber-100 px-2 py-0.5 text-[11px] font-semibold text-amber-700">${esc(r.status)}</span>`
      : `<span class="text-slate-300">—</span>`;

    const imgBtn = r.img
      ? `<a href="${esc(r.img)}" target="_blank" rel="noopener"
            class="inline-flex items-center gap-1 rounded-md border border-slate-200 px-2 py-1 text-[11px] font-medium text-slate-600 transition hover:border-indigo-300 hover:bg-indigo-50 hover:text-indigo-600">
            <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M1.5 12S5 5.5 12 5.5 22.5 12 22.5 12 19 18.5 12 18.5 1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/>
            </svg>View</a>`
      : `<span class="text-slate-300">—</span>`;

    html += `
      <tr class="transition hover:bg-slate-50">
        <td class="whitespace-nowrap px-3 py-2 text-right text-xs font-medium tabular-nums text-slate-400">${i + 1}</td>
        <td class="px-3 py-2">
          <div class="flex items-center gap-2">
            <span class="break-all font-mono text-[13px] leading-snug text-slate-700">${esc(r.ref)}</span>
            <button type="button"
                    class="copy-btn group inline-flex shrink-0 items-center gap-1 rounded-md border border-slate-200 bg-white px-2 py-1 text-[11px] font-semibold text-slate-600 transition hover:border-indigo-300 hover:bg-indigo-50 hover:text-indigo-600 active:scale-95"
                    data-copy="${esc(r.ref)}">
              ${COPY_ICON}<span class="btn-label">Copy</span>
            </button>
          </div>
        </td>
        <td class="whitespace-nowrap px-3 py-2 text-right font-semibold tabular-nums text-slate-800">${esc(r.amount)}</td>
        <td class="whitespace-nowrap px-3 py-2 text-center">${imgBtn}</td>
        <td class="whitespace-nowrap px-3 py-2">${badge}</td>
      </tr>`;
  });

  tbody.innerHTML = html;
  countEl.textContent = list.length.toLocaleString();
  totalEl.textContent = total.toLocaleString();
  emptyEl.classList.toggle("hidden", list.length > 0);
}

/* initial render */
render(records);

/* search */
let t;
searchEl.addEventListener("input", (e) => {
  clearTimeout(t);
  const q = e.target.value.trim().toLowerCase();
  t = setTimeout(() => {
    const filtered = !q
      ? records
      : records.filter(
          (r) =>
            r.ref.toLowerCase().includes(q) ||
            r.amount.toLowerCase().includes(q),
        );
    render(filtered);
  }, 120);
});

/* copy */
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
}

tbody.addEventListener("click", async (e) => {
  const btn = e.target.closest(".copy-btn");
  if (!btn) return;

  await copyText(btn.dataset.copy);

  btn.classList.remove(
    "hover:border-indigo-300",
    "hover:bg-indigo-50",
    "hover:text-indigo-600",
  );
  btn.classList.add("border-emerald-300", "bg-emerald-50", "text-emerald-600");
  btn.innerHTML = `${DONE_ICON}<span class="btn-label">Copied</span>`;

  setTimeout(() => {
    btn.classList.remove(
      "border-emerald-300",
      "bg-emerald-50",
      "text-emerald-600",
    );
    btn.classList.add(
      "hover:border-indigo-300",
      "hover:bg-indigo-50",
      "hover:text-indigo-600",
    );
    btn.innerHTML = `${COPY_ICON}<span class="btn-label">Copy</span>`;
  }, 1200);
});
</script>
