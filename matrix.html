<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CYBER_TABLE // Matrix Data Exporter</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS CDN for Excel Exports -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Google Fonts: JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            matrix: {
              black: '#030712',
              card: 'rgba(6, 22, 12, 0.75)',
              border: '#10b98133',
              green: '#10b981',
              bright: '#34d399',
              glow: '#059669',
            }
          },
          boxShadow: {
            'matrix-glow': '0 0 15px rgba(16, 185, 129, 0.3)',
            'matrix-glow-lg': '0 0 30px rgba(16, 185, 129, 0.5)',
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Matrix Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #030712;
    }
    ::-webkit-scrollbar-thumb {
      background: #059669;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    /* Glassmorphism Styles */
    .glass-card {
      background: rgba(6, 20, 12, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .glass-input {
      background: rgba(3, 10, 6, 0.8);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }
    .glass-input:focus {
      outline: none;
      border-color: #10b981;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
    }

    /* Scanline effect */
    .scanlines {
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 0, 0, 0.3) 50%,
        rgba(0, 0, 0, 0.3)
      );
      background-size: 100% 4px;
      pointer-events: none;
    }
  </style>
</head>
<body>
<div class="bg-matrix-black text-matrix-bright font-mono min-h-screen relative overflow-x-hidden selection:bg-matrix-green selection:text-black">

  <!-- Matrix Background Canvas -->
  <canvas id="matrixCanvas" class="fixed inset-0 pointer-events-none z-0 opacity-25"></canvas>
  
  <!-- Subtle Scanline Layer -->
  <div class="fixed inset-0 scanlines z-10 pointer-events-none"></div>

  <!-- MAIN APP CONTAINER -->
  <div class="relative z-20 flex flex-col min-h-screen">

    <!-- FIXED STATS HEADER -->
    <header class="sticky top-0 z-30 w-full glass-card border-b border-matrix-border px-4 py-3 shadow-matrix-glow">
      <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
        
        <!-- Logo / Title -->
        <div class="flex items-center gap-3">
          <div class="w-3 h-3 rounded-full bg-matrix-green animate-ping"></div>
          <h1 class="text-lg md:text-xl font-extrabold tracking-widest text-matrix-green uppercase drop-shadow-[0_0_8px_rgba(16,185,129,0.8)]">
            CYBER_TABLE<span class="text-xs text-emerald-500/70 ml-2 font-normal">// v2.0.26</span>
          </h1>
        </div>

        <!-- System Statistics -->
        <div class="flex flex-wrap items-center gap-4 text-xs font-semibold">
          <div class="flex items-center gap-2 bg-black/50 px-3 py-1.5 rounded-md border border-matrix-border">
            <span class="text-slate-500">ROWS:</span>
            <span id="statRows" class="text-matrix-green font-bold">0</span>
          </div>
          <div class="flex items-center gap-2 bg-black/50 px-3 py-1.5 rounded-md border border-matrix-border">
            <span class="text-slate-500">COLUMNS:</span>
            <span id="statCols" class="text-matrix-green font-bold">0</span>
          </div>
          <div class="flex items-center gap-2 bg-black/50 px-3 py-1.5 rounded-md border border-matrix-border">
            <span class="text-slate-500">DATA_SIZE:</span>
            <span id="statSize" class="text-matrix-green font-bold">0 KB</span>
          </div>
          <div class="flex items-center gap-2 bg-black/50 px-3 py-1.5 rounded-md border border-matrix-border">
            <span class="text-slate-500">STATUS:</span>
            <span id="statStatus" class="text-emerald-400 font-bold animate-pulse">READY</span>
          </div>
        </div>

      </div>
    </header>

    <!-- CONTENT BODY -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">

      <!-- TOOLBAR CONTROLS -->
      <div class="glass-card rounded-2xl p-4 shadow-matrix-glow flex flex-wrap items-center justify-between gap-4 border border-matrix-border">
        
        <!-- Import Trigger -->
        <button id="openModalBtn" class="px-5 py-2.5 rounded-xl bg-matrix-green/20 hover:bg-matrix-green/30 text-matrix-green border border-matrix-green/50 font-bold text-xs uppercase tracking-wider flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          Import / Merge Data
        </button>

        <!-- Export Buttons -->
        <div class="flex flex-wrap items-center gap-2">
          <button id="exportCsv" class="px-3.5 py-2 rounded-xl bg-black/60 hover:bg-matrix-green/10 text-matrix-bright border border-matrix-border text-xs uppercase tracking-wider font-semibold">
            CSV
          </button>
          
          <button id="exportHtml" class="px-3.5 py-2 rounded-xl bg-black/60 hover:bg-matrix-green/10 text-matrix-bright border border-matrix-border text-xs uppercase tracking-wider font-semibold">
            HTML
          </button>
          
          <button id="exportXlsx" class="px-3.5 py-2 rounded-xl bg-black/60 hover:bg-matrix-green/10 text-matrix-bright border border-matrix-border text-xs uppercase tracking-wider font-semibold">
            Excel
          </button>
          
          <button id="exportText" class="px-3.5 py-2 rounded-xl bg-black/60 hover:bg-matrix-green/10 text-matrix-bright border border-matrix-border text-xs uppercase tracking-wider font-semibold">
            TXT
          </button>
        </div>

      </div>

      <!-- MAIN DATA TABLE CONTAINER -->
      <div class="glass-card rounded-2xl overflow-hidden shadow-matrix-glow border border-matrix-border">
        <div class="overflow-x-auto max-h-[65vh] relative">
          <table id="myTable" class="w-full text-left border-collapse text-xs">
            <thead id="tableHead" class="sticky top-0 bg-black/90 backdrop-blur-md text-matrix-green uppercase tracking-wider border-b border-matrix-border z-10">
              <!-- Dynamically populated headers -->
            </thead>
            <tbody id="tableBody" class="divide-y divide-matrix-border/30">
              <!-- Dynamically populated rows -->
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- POPUP MODAL FOR INPUT DATA -->
  <div id="dataModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md hidden transition-opacity duration-300">
    <div class="glass-card rounded-2xl w-full max-w-2xl shadow-matrix-glow-lg overflow-hidden border border-matrix-green flex flex-col max-h-[90vh]">
      
      <!-- Modal Header -->
      <div class="flex items-center justify-between p-4 border-b border-matrix-border bg-black/40">
        <h3 class="text-sm font-extrabold text-matrix-green uppercase tracking-widest flex items-center gap-2">
          <span class="inline-block w-2 h-2 bg-matrix-green rounded-full animate-ping"></span>
          Input Matrix Data Sources
        </h3>
        <button id="closeModalBtn" class="text-slate-400 hover:text-matrix-green transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="p-6 overflow-y-auto space-y-6 text-xs">
        
        <!-- Drag & Drop Zone -->
        <div>
          <label class="block mb-2 font-bold text-matrix-green uppercase tracking-wider">1. File Import (Multiple Drag & Drop JSON)</label>
          <div id="dropZone" class="border-2 border-dashed border-matrix-border hover:border-matrix-green rounded-xl p-6 text-center cursor-pointer transition-all bg-black/40 hover:bg-matrix-green/5 group">
            <svg class="w-8 h-8 mx-auto mb-2 text-matrix-border group-hover:text-matrix-green transition-colors" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
            </svg>
            <p class="text-slate-400 group-hover:text-matrix-bright">Drag & drop files here, or <span class="text-matrix-green underline">click to browse</span></p>
            <span id="fileListText" class="block mt-2 font-bold text-matrix-green"></span>
            <input type="file" id="fileInput" accept=".json" multiple class="hidden" />
          </div>
        </div>

        <!-- URL Fetch -->
        <div>
          <label class="block mb-2 font-bold text-matrix-green uppercase tracking-wider">2. Fetch Data Endpoint URL</label>
          <input type="url" id="urlInput" placeholder="https://api.example.com/matrix_data.json" class="w-full glass-input rounded-xl px-4 py-2.5 text-xs font-mono placeholder:text-gray-600" />
        </div>

        <!-- Textarea Paste -->
        <div>
          <label class="block mb-2 font-bold text-matrix-green uppercase tracking-wider">3. Raw JSON Payload</label>
          <textarea id="jsonTextArea" placeholder="type..." class="w-full glass-input rounded-xl p-3 text-xs font-mono min-h-64"></textarea>
        </div>

      </div>

      <!-- Modal Footer -->
      <div class="p-4 border-t border-matrix-border bg-black/40 flex justify-end gap-3">
        <button id="cancelModalBtn" class="px-4 py-2 rounded-xl bg-black hover:bg-slate-900 border border-slate-800 text-slate-400 font-bold text-xs uppercase tracking-wider transition-colors">
          Cancel
        </button>
        <button id="createTableBtn" class="px-5 py-2 rounded-xl bg-matrix-green/20 hover:bg-matrix-green/40 border border-matrix-green text-matrix-green font-extrabold text-xs uppercase tracking-wider">
          Process Data & Merge
        </button>
      </div>

    </div>
  </div>

  <!-- ANIMATED FULL-SCREEN LOADING OVERLAY -->
  <div id="loadingOverlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black/95 backdrop-blur-lg hidden transition-opacity duration-300">
    <div class="w-full max-w-md p-6 glass-card rounded-2xl border border-matrix-green shadow-matrix-glow-lg text-center space-y-6">
      
      <!-- Matrix Cyber Spinner -->
      <div class="relative w-20 h-20 mx-auto flex items-center justify-center">
        <div class="absolute inset-0 border-4 border-matrix-green/20 rounded-full"></div>
        <div class="absolute inset-0 border-4 border-matrix-green border-t-transparent rounded-full animate-spin"></div>
        <div class="w-3 h-3 bg-matrix-bright rounded-full animate-ping"></div>
      </div>

      <!-- Status Text -->
      <div class="space-y-1">
        <h4 id="loadingText" class="text-matrix-green font-extrabold tracking-widest text-sm uppercase">Analyzing JSON...</h4>
        <p id="loadingSubtext" class="text-slate-500 text-xs font-mono">Parsing structural nodes & merging arrays</p>
      </div>

      <!-- Animated Progress Bar -->
      <div class="space-y-2">
        <div class="w-full h-2 bg-black/80 rounded-full border border-matrix-border overflow-hidden">
          <div id="progressBar" class="h-full bg-matrix-green w-0 transition-all duration-150 shadow-[0_0_10px_#10b981]"></div>
        </div>
        <div class="flex justify-between text-[10px] text-slate-500 font-mono">
          <span>0%</span>
          <span id="progressPercentage" class="text-matrix-green font-bold">0%</span>
          <span>100%</span>
        </div>
      </div>

    </div>
  </div>
</div>
  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Initial Sample Data Payload (minimal, valid example)
    const initialData = [
      {"index":1,"rowData":["AGENT NAME","USERNAME","DEPOSIT ID","AMOUNT","DEPOSIT DATE","IMAGE LINK"]},
      {"index":2,"rowData":["SSP-AG-VALE049-BK","alam2123","D1351641426","500","2026-04-26","https://example.com/img1.jpg"]},
      {"index":3,"rowData":["SSP-AG-GENIE002-BK","749064","D1347489525","500","2026-04-15","https://example.com/img2.png"]}
    ];

    document.addEventListener("DOMContentLoaded", () => {
      
      // Matrix Rain Background Generator
      const canvas = document.getElementById("matrixCanvas");
      const ctx = canvas.getContext("2d");
      const fontSize = 14;
      let columns = 0;
      let rainDrops = [];

      // Use a safe character set for the raining characters
      const katakana = "アカサタナハマヤラワガザダバパイウエオ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        columns = Math.floor(canvas.width / fontSize) || 1;
        // Recreate drops to match new column count while preserving existing positions where possible
        const newDrops = Array(columns).fill(1);
        for (let i = 0; i < Math.min(newDrops.length, rainDrops.length); i++) {
          newDrops[i] = rainDrops[i] || 1;
        }
        rainDrops = newDrops;
      }
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);

      function drawMatrix() {
        if (!ctx) return;
        ctx.fillStyle = "rgba(3, 7, 18, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#10b981";
        ctx.font = fontSize + "px monospace";

        for (let i = 0; i < rainDrops.length; i++) {
          const text = katakana.charAt(Math.floor(Math.random() * katakana.length));
          ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
          if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            rainDrops[i] = 0;
          }
          rainDrops[i]++;
        }
      }
      // Use requestAnimationFrame for smoother animation control
      (function loop() {
        drawMatrix();
        setTimeout(() => requestAnimationFrame(loop), 33);
      })();

      // Element References
      const modal = document.getElementById("dataModal");
      const openModalBtn = document.getElementById("openModalBtn");
      const closeModalBtn = document.getElementById("closeModalBtn");
      const cancelModalBtn = document.getElementById("cancelModalBtn");
      const createTableBtn = document.getElementById("createTableBtn");
      
      const dropZone = document.getElementById("dropZone");
      const fileInput = document.getElementById("fileInput");
      const fileListText = document.getElementById("fileListText");
      const urlInput = document.getElementById("urlInput");
      const jsonTextArea = document.getElementById("jsonTextArea");

      const loadingOverlay = document.getElementById("loadingOverlay");
      const loadingText = document.getElementById("loadingText");
      const progressBar = document.getElementById("progressBar");
      const progressPercentage = document.getElementById("progressPercentage");

      const tableHead = document.getElementById("tableHead");
      const tableBody = document.getElementById("tableBody");

      // Stats Elements
      const statRows = document.getElementById("statRows");
      const statCols = document.getElementById("statCols");
      const statSize = document.getElementById("statSize");
      const statStatus = document.getElementById("statStatus");

      let selectedFiles = [];

      // Modal Controls
      openModalBtn.addEventListener("click", () => modal.classList.remove("hidden"));
      const closeModal = () => modal.classList.add("hidden");
      closeModalBtn.addEventListener("click", closeModal);
      cancelModalBtn.addEventListener("click", closeModal);

      // Drag & Drop Functionality
      dropZone.addEventListener("click", () => fileInput.click());
      
      ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          dropZone.classList.add("border-matrix-green", "bg-matrix-green/10");
        });
      });

      ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          dropZone.classList.remove("border-matrix-green", "bg-matrix-green/10");
        });
      });

      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        const files = Array.from(e.dataTransfer.files || []).filter(f => f.name && f.name.toLowerCase().endsWith('.json'));
        if (files.length > 0) {
          selectedFiles = files;
          fileListText.textContent = `${files.length} JSON file(s) selected`;
        }
      });

      fileInput.addEventListener("change", (e) => {
        selectedFiles = Array.from(e.target.files || []).filter(f => f.name && f.name.toLowerCase().endsWith('.json'));
        fileListText.textContent = `${selectedFiles.length} JSON file(s) selected`;
      });

      // Animated Loading Simulation Function
      function triggerLoading(message, callback) {
        loadingOverlay.classList.remove("hidden");
        loadingText.textContent = message;
        progressBar.style.width = "0%";
        progressPercentage.textContent = "0%";

        let progress = 0;
        const interval = setInterval(() => {
          progress += Math.floor(Math.random() * 20) + 5;
          if (progress > 100) progress = 100;
          progressBar.style.width = `${progress}%`;
          progressPercentage.textContent = `${progress}%`;

          if (progress === 100) {
            clearInterval(interval);
            setTimeout(() => {
              loadingOverlay.classList.add("hidden");
              try { callback(); } catch (e) { console.error(e); }
            }, 250);
          }
        }, 120);
      }

      // Safe Table Extraction Utility (Retrieves URLs correctly)
      function getTableData() {
        const headerCells = Array.from(document.querySelectorAll('#myTable thead th'));
        const headers = headerCells.map(h => h.innerText.trim());
        const rows = [headers];

        Array.from(document.querySelectorAll('#myTable tbody tr')).forEach(tr => {
          const cells = Array.from(tr.cells).map(cell => {
            const link = cell.querySelector('a');
            return (link && link.href) ? link.href : cell.innerText.trim();
          });
          rows.push(cells);
        });
        return rows;
      }

      // Render Table Data & Update Header Stats
      function renderTable(dataArray) {
        if (!Array.isArray(dataArray) || dataArray.length === 0) {
          alert("Invalid or empty data array provided.");
          return;
        }

        tableHead.innerHTML = "";
        tableBody.innerHTML = "";

        const headerObj = dataArray.find(item => item.index === 1);
        const headers = headerObj ? headerObj.rowData : (Array.isArray(dataArray[0].rowData) ? dataArray[0].rowData : []);

        if (!Array.isArray(headers)) {
          alert('Unable to determine headers from provided data');
          return;
        }

        // Render Headings
        const trHead = document.createElement("tr");
        headers.forEach(headerText => {
          const th = document.createElement("th");
          th.className = "p-3.5 font-bold border-b border-matrix-border whitespace-nowrap text-matrix-bright";
          th.textContent = headerText;
          trHead.appendChild(th);
        });
        tableHead.appendChild(trHead);

        // Prepare rows
        const rowsData = dataArray.filter(item => item.index !== 1 && Array.isArray(item.rowData));
        rowsData.forEach(rowItem => {
          const tr = document.createElement("tr");
          tr.className = "hover:bg-matrix-green/10 transition-colors border-b border-matrix-border/30";

          headers.forEach((_, cellIndex) => {
            const td = document.createElement("td");
            td.className = "p-2 border";
            const val = rowItem.rowData[cellIndex] || "";

            // URL check & link conversion for images
            if (typeof val === "string" && val.startsWith("http") && (val.match(/\.(jpg|jpeg|png|gif|webp)$/i))) {
              td.innerHTML = `<a href="${val}" target="_blank" rel="noopener noreferrer" class="text-matrix-green hover:underline flex items-center gap-1">View Image</a>`;
            } else {
              td.textContent = val;
            }
            tr.appendChild(td);
          });
          tableBody.appendChild(tr);
        });

        // Update Stats
        let jsonString;
        try { jsonString = JSON.stringify(dataArray); } catch (e) { jsonString = '' }
        const sizeInKB = jsonString ? (new Blob([jsonString]).size / 1024).toFixed(2) : '0.00';
        
        statRows.textContent = Math.max(0, rowsData.length);
        statCols.textContent = headers.length;
        statSize.textContent = `${sizeInKB} KB`;
        statStatus.textContent = "SYNCHRONIZED";
      }

      // Default Table Init
      try { jsonTextArea.value = JSON.stringify(initialData, null, 2); renderTable(initialData); } catch (e) { console.error(e); }

      // Merge and Process Input Data
      createTableBtn.addEventListener("click", async () => {
        try {
          // Process Selected Files
          if (selectedFiles.length > 0) {
            triggerLoading(`Merging ${selectedFiles.length} JSON File(s)...`, async () => {
              let mergedData = [];
              let nextIndex = 2; // reserve 1 for header if found
              let masterHeaders = null;

              for (const file of selectedFiles) {
                try {
                  const text = await file.text();
                  const parsed = JSON.parse(text);

                  if (Array.isArray(parsed)) {
                    parsed.forEach(item => {
                      if (item && item.index === 1 && !masterHeaders && Array.isArray(item.rowData)) {
                        masterHeaders = item.rowData;
                        mergedData.push({ index: 1, rowData: masterHeaders });
                      } else if (item && item.index !== 1 && Array.isArray(item.rowData)) {
                        mergedData.push({ index: nextIndex++, rowData: item.rowData });
                      }
                    });
                  }
                } catch (e) {
                  console.warn('Skipping file due to parse error', file.name, e.message);
                }
              }

              // If no header found but mergedData has rows, create a header based on longest row
              if (!masterHeaders && mergedData.length > 0) {
                const longest = mergedData.reduce((a,b) => (b.rowData && b.rowData.length > (a.rowData? a.rowData.length:0)) ? b : a, mergedData[0]);
                masterHeaders = longest.rowData.map((_, i) => `Column ${i+1}`);
                mergedData.unshift({ index: 1, rowData: masterHeaders });
              }

              if (mergedData.length === 0) return alert('No valid JSON rows found in selected files.');

              renderTable(mergedData);
              closeModal();
            });
            return;
          }

          // Process URL Fetch
          if (urlInput.value.trim() !== "") {
            const endpoint = urlInput.value.trim();
            triggerLoading("Fetching Remote JSON Endpoint...", async () => {
              try {
                const res = await fetch(endpoint);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const parsed = await res.json();
                renderTable(parsed);
                closeModal();
              } catch (e) {
                alert('Failed to fetch or parse remote JSON: ' + e.message);
              }
            });
            return;
          }

          // Process Raw Textarea JSON
          if (jsonTextArea.value.trim() !== "") {
            triggerLoading("Analyzing JSON Text Payload...", () => {
              try {
                const parsed = JSON.parse(jsonTextArea.value.trim());
                renderTable(parsed);
                closeModal();
              } catch (e) {
                alert('JSON parse error: ' + e.message);
              }
            });
            return;
          }

          alert("Please upload a file, enter a URL endpoint, or paste raw JSON.");
        } catch (err) {
          alert("Data Processing Error: " + (err && err.message ? err.message : err));
        }
      });

      // Download helper function
      function downloadFile(content, filename, mimeType) {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      // Export Buttons Event Listeners
      document.getElementById("exportCsv").addEventListener("click", () => {
        triggerLoading("Generating CSV File...", () => {
          const rows = getTableData();
          const csvContent = rows.map(r => r.map(val => '"' + String(val).replace(/"/g, '""') + '"').join(',')).join("\n");
          downloadFile(csvContent, "matrix_data_export.csv", "text/csv;charset=utf-8;");
        });
      });

      document.getElementById("exportHtml").addEventListener("click", () => {
        triggerLoading("Building Standalone HTML Document...", () => {
          const tableHtml = document.getElementById("myTable").outerHTML;
          const htmlDoc = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matrix Export</title><style>body{background:#030712;color:#34d399;font-family:monospace;padding:16px}table{border-collapse:collapse;width:100%}th,td{padding:8px;border:1px solid rgba(16,185,129,0.15)}</style></head><body>${tableHtml}</body></html>`;
          downloadFile(htmlDoc, "matrix_data_export.html", "text/html;charset=utf-8;");
        });
      });

      document.getElementById("exportXlsx").addEventListener("click", () => {
        if (typeof XLSX === "undefined") return alert("Excel library unaccessible.");
        triggerLoading("Compiling Excel Spreadsheet...", () => {
          try {
            const workbook = XLSX.utils.table_to_book(document.getElementById("myTable"), { sheet: "MatrixData" });
            XLSX.writeFile(workbook, "matrix_data_export.xlsx");
          } catch (e) { alert('Excel export failed: ' + e.message); }
        });
      });

      document.getElementById("exportText").addEventListener("click", () => {
        triggerLoading("Generating Plain Text File...", () => {
          const rows = getTableData();
          const textContent = rows.map(r => r.join("\t")).join("\n");
          downloadFile(textContent, "matrix_data_export.txt", "text/plain;charset=utf-8;");
        });
      });

    });
  </script>
  <script src="https://hckrxyzz.github.io/js/filterTable.js"></script>
  <script src="https://hckrxyzz.github.io/js/scrollbutton.js"></script>
  <script src="https://hckrxyzz.github.io/js/textareaBtn.js"></script>
</body>
</html>
