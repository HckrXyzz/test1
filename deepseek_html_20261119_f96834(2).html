<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#020617" />
<title>Transactions · Reference Ledger</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
          mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace'],
        },
      },
    },
  };
</script>

<style>
  html, body { height: 100%; }
  body {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overscroll-behavior-y: none;
  }

  /* 🔒 Selection is disabled everywhere… */
  body, body * { -webkit-user-select: none; user-select: none; }
  /* …except real inputs so search still works */
  input, textarea { -webkit-user-select: text; user-select: text; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
  ::-webkit-scrollbar-thumb:hover { background: #334155; }

  mark { background: rgba(250, 204, 21, .22); color: #fde68a; border-radius: 4px; padding: 0 2px; }

  @keyframes rowFlash {
    0%   { background-color: rgba(16, 185, 129, .22); }
    100% { background-color: transparent; }
  }
  .row-copied { animation: rowFlash .7s ease-out; }
</style>
</head>

<body class="bg-slate-950 text-slate-100 antialiased selection:bg-transparent">

  <!-- ═══════════════ APP SHELL (exactly one screen tall on mobile) ═══════════════ -->
  <div class="flex h-[100dvh] flex-col">

    <!-- ───────── Sticky header + search ───────── -->
    <header class="shrink-0 border-b border-slate-800 bg-slate-950/95 px-4 pb-3 pt-[max(0.9rem,env(safe-area-inset-top))] backdrop-blur">
      <div class="mx-auto flex w-full max-w-3xl items-center justify-between gap-3">
        <div class="min-w-0">
          <h1 class="truncate text-[15px] font-semibold tracking-tight text-slate-50">Transactions</h1>
          <p class="mt-0.5 truncate text-[11px] text-slate-500">Tap a row to copy the reference number</p>
        </div>
        <span id="countBadge"
              class="shrink-0 rounded-full bg-slate-800 px-2.5 py-1 text-[11px] font-semibold tabular-nums text-slate-300">0</span>
      </div>

      <div class="mx-auto mt-3 w-full max-w-3xl">
        <div class="relative">
          <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-500"
               viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path>
          </svg>

          <input id="search" type="text" inputmode="search" autocomplete="off" autocorrect="off"
                 spellcheck="false" enterkeyhint="search" placeholder="Search reference or amount…"
                 class="w-full rounded-xl border border-slate-800 bg-slate-900 py-2.5 pl-10 pr-10 text-[13px]
                        text-slate-100 placeholder:text-slate-500
                        focus:border-emerald-500/60 focus:outline-none focus:ring-2 focus:ring-emerald-500/20" />

          <button id="clearBtn" type="button" aria-label="Clear search"
                  class="absolute right-2 top-1/2 hidden -translate-y-1/2 rounded-lg p-1.5 text-slate-500 hover:bg-slate-800 hover:text-slate-300 active:scale-90">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- ───────── Scrollable table ───────── -->
    <main class="min-h-0 flex-1 overflow-y-auto overscroll-contain">
      <table class="w-full table-auto border-collapse text-[13px]">
        <thead>
          <tr>
            <th scope="col"
                class="sticky top-0 z-10 border-b border-slate-800 bg-slate-900/95 px-3 py-2 text-left
                       text-[10px] font-semibold uppercase tracking-wider text-slate-400 backdrop-blur">
              Reference no
            </th>
            <th scope="col"
                class="sticky top-0 z-10 w-px border-b border-slate-800 bg-slate-900/95 px-2 py-2 text-right
                       text-[10px] font-semibold uppercase tracking-wider text-slate-400 backdrop-blur">
              Amount
            </th>
            <th scope="col"
                class="sticky top-0 z-10 w-px border-b border-slate-800 bg-slate-900/95 px-2 py-2 text-right
                       text-[10px] font-semibold uppercase tracking-wider text-slate-400 backdrop-blur">
              Image
            </th>
          </tr>
        </thead>
        <tbody id="rows" class="divide-y divide-slate-800/70"></tbody>
      </table>
    </main>

    <!-- ───────── Footer summary ───────── -->
    <footer class="shrink-0 border-t border-slate-800 bg-slate-950 px-4 py-2 pb-[max(0.5rem,env(safe-area-inset-bottom))]">
      <div class="mx-auto flex w-full max-w-3xl items-center justify-between text-[11px] text-slate-500">
        <span id="footerCount">Showing 0 of 0</span>
        <span>Total <b id="footerTotal" class="font-semibold tabular-nums text-slate-300">0</b></span>
      </div>
    </footer>
  </div>

  <!-- ═══════════════ TOAST ═══════════════ -->
  <div id="toast"
       class="pointer-events-none fixed inset-x-0 bottom-24 z-50 flex translate-y-2 justify-center px-4 opacity-0 transition-all duration-200">
    <div id="toastBox"
         class="flex items-center gap-2 rounded-full border border-emerald-500/30 bg-emerald-500/15 px-4 py-2
                text-[13px] font-medium text-emerald-300 shadow-lg shadow-black/40 backdrop-blur">
      <svg id="toastIcon" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
      <span id="toastText">Copied</span>
    </div>
  </div>

    const DATA = RAW.map(function (r) {
      return { ref: r[0], amt: r[1], url: r[2] };
    });

    /* ---------- DOM refs ---------- */
    const tbody      = document.getElementById('rows');
    const searchEl   = document.getElementById('search');
    const clearBtn   = document.getElementById('clearBtn');
    const countBadge = document.getElementById('countBadge');
    const footerCnt  = document.getElementById('footerCount');
    const footerTot  = document.getElementById('footerTotal');
    const toast      = document.getElementById('toast');
    const toastBox   = document.getElementById('toastBox');
    const toastText  = document.getElementById('toastText');

    /* ---------- Helpers ---------- */
    const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    function esc(v) { return String(v).replace(/[&<>"']/g, function (c) { return ESC[c]; }); }

    function hl(text, q) {
      if (!q) return esc(text);
      const i = String(text).toLowerCase().indexOf(q);
      if (i === -1) return esc(text);
      const s = String(text);
      return esc(s.slice(0, i)) +
             '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' +
             esc(s.slice(i + q.length));
    }

    const fmt = function (n) { return Number(n).toLocaleString('en-US'); };

    /* ---------- Render ---------- */
    function render(query) {
      const q  = (query || '').trim().toLowerCase();
      const qn = q.replace(/,/g, '');

      const list = q
        ? DATA.filter(function (d) {
            return d.ref.toLowerCase().indexOf(q) !== -1 ||
                   String(d.amt).indexOf(qn) !== -1 ||
                   fmt(d.amt).toLowerCase().indexOf(q) !== -1;
          })
        : DATA;

      if (!list.length) {
        tbody.innerHTML =
          '<tr><td colspan="3" class="px-6 py-20 text-center">' +
            '<p class="text-sm font-medium text-slate-300">No match found</p>' +
            '<p class="mt-1 text-xs text-slate-500">Nothing for “' + esc(query) + '” — try a reference or amount</p>' +
          '</td></tr>';
      } else {
        tbody.innerHTML = list.map(function (d) {
          const imgCell = d.url
            ? '<a href="' + esc(d.url) + '" target="_blank" rel="noopener noreferrer" ' +
              'class="inline-flex items-center gap-1 rounded-lg border border-slate-700 px-2 py-1 ' +
              'text-[11px] font-medium text-slate-300 transition hover:border-emerald-500/60 ' +
              'hover:text-emerald-300 active:scale-95">' +
                '<svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
                     'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                  '<rect x="3" y="3" width="18" height="18" rx="2"></rect>' +
                  '<circle cx="9" cy="9" r="2"></circle>' +
                  '<path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path>' +
                '</svg><span class="hidden sm:inline">View</span>' +
              '</a>'
            : '<span class="pr-2 text-slate-600">—</span>';

          return '<tr data-ref="' + esc(d.ref) + '" ' +
                 'class="cursor-pointer transition-colors hover:bg-slate-800/40 active:bg-slate-800/70">' +
              '<td class="px-3 py-2.5 align-middle">' +
                '<span class="flex items-start gap-1.5">' +
                  '<span class="break-all font-mono text-[12.5px] leading-snug text-slate-100">' +
                    hl(d.ref, q) +
                  '</span>' +
                  '<svg class="mt-[2px] h-3.5 w-3.5 shrink-0 text-slate-600" viewBox="0 0 24 24" fill="none" ' +
                       'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                    '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>' +
                    '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>' +
                  '</svg>' +
                '</span>' +
              '</td>' +
              '<td class="whitespace-nowrap px-2 py-2.5 text-right align-middle">' +
                '<span class="rounded-md bg-slate-800/80 px-2 py-1 text-[12px] font-semibold tabular-nums text-emerald-300">' +
                  fmt(d.amt) +
                '</span>' +
              '</td>' +
              '<td class="whitespace-nowrap px-2 py-2.5 text-right align-middle">' + imgCell + '</td>' +
            '</tr>';
        }).join('');
      }

      const total = list.reduce(function (s, d) { return s + Number(d.amt || 0); }, 0);

      countBadge.textContent = list.length;
      footerCnt.textContent  = 'Showing ' + list.length + ' of ' + DATA.length;
      footerTot.textContent  = total.toLocaleString('en-US');
      clearBtn.classList.toggle('hidden', !q);
    }

    /* ---------- Toast ---------- */
    let toastTimer = null;
    function showToast(msg, ok) {
      toastText.textContent = msg;
      const good = ok !== false;
      toastBox.className =
        'flex items-center gap-2 rounded-full border px-4 py-2 text-[13px] font-medium shadow-lg shadow-black/40 backdrop-blur ' +
        (good ? 'border-emerald-500/30 bg-emerald-500/15 text-emerald-300'
              : 'border-rose-500/30 bg-rose-500/15 text-rose-300');
      toast.classList.remove('opacity-0', 'translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toast.classList.add('opacity-0', 'translate-y-2');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 1600);
    }

    /* ---------- Clipboard ---------- */
    function legacyCopy(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;' +
                           'pointer-events:none;-webkit-user-select:text;user-select:text';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, text.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (e) { return false; }
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall through */ }
      }
      return legacyCopy(text);
    }

    /* ---------- Row click → copy ---------- */
    tbody.addEventListener('click', async function (e) {
      if (e.target.closest('a')) return;            // image links keep working
      const row = e.target.closest('tr[data-ref]');
      if (!row) return;

      const ref = row.dataset.ref;
      const ok  = await copyText(ref);

      if (ok) {
        row.classList.remove('row-copied');
        void row.offsetWidth;                       // restart animation
        row.classList.add('row-copied');
        showToast('Copied  ' + ref, true);
      } else {
        showToast('Copy failed — long-press to copy', false);
      }
    });

    /* ---------- Search ---------- */
    let rafId = null;
    searchEl.addEventListener('input', function () {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(function () { render(searchEl.value); });
    });
    searchEl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); searchEl.blur(); }
    });
    clearBtn.addEventListener('click', function () {
      searchEl.value = '';
      render('');
      searchEl.focus();
    });

    /* ═══════════════════════════════════════════════════════════
       🔒  ANTI-SELECTION LAYER
       ═══════════════════════════════════════════════════════════ */
    function isEditable(el) {
      return !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
    }

    document.addEventListener('keydown', function (e) {
      const k = (e.key || '').toLowerCase();
      if ((e.ctrlKey || e.metaKey) && !isEditable(e.target) && (k === 'a' || k === 'c' || k === 'x')) {
        e.preventDefault();
        e.stopPropagation();
        if (k === 'a') showToast('Select-all is disabled — tap a row to copy', false);
      }
    }, true);

    document.addEventListener('selectstart', function (e) {
      if (!isEditable(e.target)) e.preventDefault();
    }, true);

    document.addEventListener('copy', function (e) {
      if (!isEditable(e.target)) e.preventDefault();
    });

    document.addEventListener('dragstart', function (e) { e.preventDefault(); });

    document.addEventListener('contextmenu', function (e) {
      if (e.target.closest('table')) e.preventDefault();
    });

    document.addEventListener('touchstart', function () {
      if (document.getSelection) {
        const sel = document.getSelection();
        if (sel && sel.rangeCount > 0 && !isEditable(document.activeElement)) sel.removeAllRanges();
      }
    }, { passive: true });

    document.addEventListener('selectionchange', function () {
      const sel = document.getSelection();
      if (sel && !sel.isCollapsed && !isEditable(document.activeElement)) sel.removeAllRanges();
    });

    /* ---------- Boot ---------- */
    render('');
  })();
  </script>
</body>
</html>
