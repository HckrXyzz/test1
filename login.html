<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Management Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body onload="mainScript()">
    <div class="bg-gray-900" id="app">
      <div id="login" class="container mt-8 p-6 rounded-lg neon-box bg-gray-800 max-w-2xl mx-auto shadow-xl">
        <h1 class="text-3xl font-bold text-center mb-6 text-cyan-400 neon-glow">
          Login
        </h1>

        <div class="mb-4">
          <label
            for="gistId"
            class="block text-lg font-medium mb-2 text-gray-300"> USERNAME </label>
          <input
            class="w-full p-3 bg-gray-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors duration-200"
            type="text"
            id="gistId"
            value=""
            placeholder=""
          />
        </div>
        <div class="mb-4">
          <label for="password"
            class="block text-lg font-medium mb-2 text-gray-300">PASSWORD</label>
          <input onfocus="this.value=localStorage.getItem('gistToken')"
            type="password"
            id="password"
            placeholder="Password"
            value=""
            class="w-full p-3 bg-gray-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors duration-200"/>
        </div>

        <button
          type="button"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-lg p-3 uppercase text-xl font-bold shadow-lg border-b-4 border-blue-800 transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-900 mb-4"
          id="loginBtn"
        >
          LOGIN
        </button>

        <div id="status" class="status mt-6 p-3 bg-gray-700 text-center text-lg rounded-lg text-red-500"></div>
      </div>
    </div>

    
  <script>
    
  async function authLogin() {
  const username = document.getElementById("gistId").value;
  const password = document.getElementById("password").value;
  const loginBtn = document.getElementById("loginBtn");
  const response = await fetch(`https://api.github.com/gists/${username}`, {
    headers: {
      Accept: "application/vnd.github.v3+json",
      Authorization: "token " + password,
    },
    method: "GET",
  });
  if (response.status == 200) {
    const data = await response.json();
    localStorage.setItem("gistData", JSON.stringify(data));
    const index = data.files["index.html"].content;
    document.write(index);
  } else {
    document.getElementById("status").innerHTML = "Invalid Credentials";
  }
}
document.addEventListener("DOMContentLoaded", function () {
  const loginBtn = document.getElementById("loginBtn");
  loginBtn.addEventListener("click", authLogin);
});

</script>
    
</body>
</html>
