<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Search Portal</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans antialiased selection:bg-blue-500 selection:text-white">

    <!-- Container View -->
    <div class="max-w-2xl mx-auto px-4 py-12 sm:px-6">
        
        <!-- Header Section -->
        <div class="text-center mb-10">
            <h1 class="text-3xl font-extrabold text-white tracking-tight sm:text-4xl">
                TransactionID search Portal
            </h1>
            <p class="mt-3 text-sm text-gray-400 max-w-xl mx-auto">
                Search via unique Transaction ID to extract corresponding structural profile mappings instantly.
            </p>
        </div>

        <!-- Search Form Card -->
        <div class="bg-gray-800 border border-gray-700/50 rounded-2xl p-6 shadow-xl mb-8">
            <form id="lookupForm" class="space-y-4 sm:space-y-0 sm:flex sm:items-center sm:gap-4">
                <div class="flex-1">
                    <label for="transactionId" class="sr-only">Transaction ID</label>
                    <input 
                        type="text" 
                        id="transactionId" 
                        placeholder="Enter ID (e.g. 75OZNU4O)" 
                        required
                        class="w-full bg-gray-900 text-white placeholder-gray-500 border border-gray-700 rounded-xl px-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all font-medium text-base"
                    >
                </div>
                <button 
                    type="submit"
                    class="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl px-6 py-3.5 transition-colors duration-200 shadow-lg shadow-blue-900/30 active:scale-[0.98] cursor-pointer text-center whitespace-nowrap"
                >
                    Search Records
                </button>
            </form>
        </div>

        <!-- Error Alert (Hidden by default) -->
        <div id="errorMessage" class="hidden bg-red-950/40 border border-red-800/60 text-red-300 rounded-xl p-4 mb-8 text-sm flex items-start gap-3">
            <svg class="w-5 h-5 text-red-400 shrink-0 mt-0.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
            </svg>
            <span id="errorText"></span>
        </div>

        <!-- Skeleton Loading State (Animated, hidden by default) -->
        <div id="loadingState" class="hidden space-y-4 animate-pulse">
            <div class="h-6 bg-gray-800 rounded-md w-1/4 mb-2"></div>
            <div class="bg-gray-800 border border-gray-700/40 rounded-2xl p-6 space-y-4 shadow-lg">
                <div class="flex justify-between border-b border-gray-700/40 pb-3"><div class="h-4 bg-gray-700 rounded w-1/3"></div><div class="h-4 bg-gray-700 rounded w-1/4"></div></div>
                <div class="flex justify-between border-b border-gray-700/40 pb-3"><div class="h-4 bg-gray-700 rounded w-1/4"></div><div class="h-4 bg-gray-700 rounded w-1/2"></div></div>
                <div class="flex justify-between border-b border-gray-700/40 pb-3"><div class="h-4 bg-gray-700 rounded w-1/3"></div><div class="h-32 bg-gray-700 rounded w-1/2"></div></div>
            </div>
        </div>

        <!-- Dynamic Card Results Section Container -->
        <div id="resultContainer" class="space-y-6"></div>

    </div>

    <script>
        const SPREADSHEET_ID = '1W-DmVo6eG-AO7ta8VmWo7ze1h0rVYhnnjYPklhtddjQ';
        const SHEET_NAME = 'Sheet2'; 

        document.getElementById('lookupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const txnId = document.getElementById('transactionId').value.trim();
            const loadingState = document.getElementById('loadingState');
            const errorDiv = document.getElementById('errorMessage');
            const resultContainer = document.getElementById('resultContainer');
            
            loadingState.classList.remove('hidden');
            errorDiv.classList.add('hidden');
            resultContainer.innerHTML = '';

            const query = encodeURIComponent(`SELECT * WHERE A = '${txnId}'`);
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tq=${query}&sheet=${SHEET_NAME}`;

            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error('Failed to connect to spreadsheet data feed.');
                    return response.text();
                })
                .then(txt => {
                    const jsonString = txt.substring(txt.indexOf('{'), txt.lastIndexOf('}') + 1);
                    const data = JSON.parse(jsonString);
                    
                    loadingState.classList.add('hidden');

                    if (data.status === 'error') {
                        throw new Error(data.errors[0].detailed_message || 'Error processing query parameters.');
                    }

                    const tableData = data.table;
                    
                    if (!tableData.rows || tableData.rows.length === 0) {
                        showError(`No row matches found matching Transaction ID: "${txnId}"`);
                        return;
                    }

                    // Extract headers mapping labels
                    const columnHeaders = tableData.cols.map((col, idx) => col.label || `Column ${idx + 1}`);

                    let html = '';

                    // Generate a structural layout card for each matched spreadsheet row
                    tableData.rows.forEach((row, rowIndex) => {
                        html += `
                            <div class="bg-gray-800 border border-gray-700/60 rounded-2xl shadow-xl overflow-hidden">
                                <div class="bg-gray-950/40 px-6 py-4 border-b border-gray-700/50 flex justify-between items-center">
                                    <h3 class="text-sm font-semibold tracking-wider text-gray-400 uppercase">Record Match #${rowIndex + 1}</h3>
                                    <span class="inline-flex items-center rounded-md bg-green-500/10 px-2 py-0.5 text-xs font-medium text-green-400 ring-1 ring-inset ring-green-500/20">Verified</span>
                                </div>
                                <div class="p-6 space-y-4 divide-y divide-gray-700/40">
                        `;

                        row.c.forEach((cell, cellIndex) => {
                            const label = columnHeaders[cellIndex];
                            const rawValue = cell ? (cell.f || cell.v || '') : '';
                            
                            // Check clean string text variants to safely isolate Image Link inputs
                            const isImage = typeof rawValue === 'string' && (rawValue.startsWith('http://') || rawValue.startsWith('https://')) && (/\.(jpeg|jpg|gif|png|webp)/i.test(rawValue) || label.toUpperCase().includes('IMAGE'));
                            
                            // Prevent empty spacers from creating border layout anomalies on index 0 items
                            const ptClass = cellIndex === 0 ? '' : 'pt-4';

                            html += `
                                <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-2 ${ptClass}">
                                    <span class="text-sm font-semibold text-gray-400 shrink-0 sm:w-1/3">${label}</span>
                                    <div class="text-sm font-medium text-white break-all sm:w-2/3 text-left sm:text-right">
                            `;

                            if (isImage) {
                                html += `<img src="${rawValue}" alt="${label}" class="mt-1 max-h-48 rounded-xl object-contain border border-gray-700 shadow-md inline-block max-w-full">`;
                            } else {
                                // Status styling accent decoration rules
                                if (label.toLowerCase() === 'status') {
                                    const isApproved = rawValue.toLowerCase() === 'approved';
                                    html += `<span class="${isApproved ? 'text-green-400 bg-green-950/30 ring-1 ring-green-800/50' : 'text-amber-400 bg-amber-950/30 ring-1 ring-amber-800/50'} px-2.5 py-1 rounded-md text-xs font-bold uppercase tracking-wider">${rawValue}</span>`;
                                } else {
                                    html += rawValue;
                                }
                            }

                            html += `
                                    </div>
                                </div>
                            `;
                        });

                        html += `
                                </div>
                            </div>
                        `;
                    });

                    resultContainer.innerHTML = html;
                })
                .catch(err => {
                    loadingState.classList.add('hidden');
                    showError(err.message);
                    console.error(err);
                });
        });

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
