<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Follow-up Table</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Manrope', sans-serif;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 50;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
    }
    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background-color: #1e293b;
      padding: 2rem;
      border-radius: 0.5rem;
      max-width: 500px;
      width: 90%;
      color: #e2e8f0;
      border: 1px solid #475569;
    }
    .close-btn {
      float: right;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
      color: #94a3b8;
    }
    .close-btn:hover {
      color: #f1f5f9;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100">
  <div class="min-h-screen p-4">
    <div class="max-w-6xl mx-auto">
      <h1 class="text-3xl font-bold mb-6 text-pink-600">Follow-up Dashboard</h1>
      
      <div class="overflow-x-auto rounded-lg border border-slate-700">
        <table class="w-full bg-gray-800 text-gray-200 text-sm">
          <thead class="bg-slate-900 sticky top-0 z-40 text-slate-300 font-semibold">
            <tr class="border-b border-slate-700">
              <th class="px-4 py-3 text-left">REFERENCE NO</th>
              <th class="px-4 py-3 text-left">AMOUNT</th>
              <th class="px-4 py-3 text-left">IMAGE</th>
              <th class="px-4 py-3 text-center">DETAILS</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-700" id="tableBody">
            <!-- Table rows will be populated by JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Details Modal -->
  <div id="detailsModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2 class="text-xl font-bold mb-4 text-pink-600">Transaction Details</h2>
      <div id="modalBody">
        <!-- Details will be populated here -->
      </div>
    </div>
  </div>

        datePosted: "1791404137",

        status: "ALREADY FOLLOW UP"
      }
    ];

    function populateTable() {
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = tableData.map(row => `
        <tr class="hover:bg-gray-700 transition-colors">
          <td class="px-4 py-3 font-mono text-pink-400">${row.referenceNo}</td>
          <td class="px-4 py-3 font-semibold">${row.amount}</td>
          <td class="px-4 py-3">
            <button type="button" class="px-3 py-1 text-xs font-semibold rounded bg-slate-700 text-white shadow hover:bg-slate-600 transition"
              onclick="openImageModal('${row.imageLink}')">
              View Image
            </button>
          </td>
          <td class="px-4 py-3 text-center">
            <button type="button" class="px-4 py-2 bg-pink-600 text-white font-semibold rounded hover:bg-pink-700 transition"
              onclick="openDetailsModal(${JSON.stringify(row).replace(/"/g, '&quot;')})">
              Details
            </button>
          </td>
        </tr>
      `).join('');
    }

    function openDetailsModal(data) {
      const modal = document.getElementById('detailsModal');
      const modalBody = document.getElementById('modalBody');
      
      modalBody.innerHTML = `
        <div class="space-y-3 text-sm">
          <div class="border-b border-slate-600 pb-2">
            <p class="text-slate-400">Agent Name</p>
            <p class="font-semibold">${data.agentName}</p>
          </div>
          <div class="border-b border-slate-600 pb-2">
            <p class="text-slate-400">Username</p>
            <p class="font-semibold">${data.username}</p>
          </div>
          <div class="border-b border-slate-600 pb-2">
            <p class="text-slate-400">Deposit ID</p>
            <p class="font-mono text-pink-400">${data.depositId}</p>
          </div>
          <div class="border-b border-slate-600 pb-2">
            <p class="text-slate-400">Reference Number</p>
            <p class="font-mono text-pink-400">${data.referenceNo}</p>
          </div>
          <div class="border-b border-slate-600 pb-2">
            <p class="text-slate-400">Amount</p>
            <p class="font-semibold text-green-400">${data.amount}</p>
          </div>
          <div class="border-b border-slate-600 pb-2">
            <p class="text-slate-400">Customer Number</p>
            <p class="font-semibold">${data.customerNumber}</p>
          </div>
          <div class="border-b border-slate-600 pb-2">
            <p class="text-slate-400">Deposit Date</p>
            <p class="font-semibold">${data.depositDate}</p>
          </div>
          <div class="border-b border-slate-600 pb-2">
            <p class="text-slate-400">Status</p>
            <p class="font-semibold text-blue-400">${data.status}</p>
          </div>
          <div>
            <p class="text-slate-400">API Status</p>
            <p class="font-semibold">${data.apiStatus}</p>
          </div>
        </div>
      `;
      
      modal.classList.add('active');
    }

    function openImageModal(imageUrl) {
      alert('Image URL: ' + imageUrl + '\n\nNote: Image preview would load here if URL was valid.');
    }

    function closeModal() {
      const modal = document.getElementById('detailsModal');
      modal.classList.remove('active');
    }

    // Close modal when clicking outside
    window.onclick = function(event) {
      const modal = document.getElementById('detailsModal');
      if (event.target === modal) {
        modal.classList.remove('active');
      }
    };

    // Populate table on page load
    populateTable();
  </script>
</body>
</html>
