<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Switch Button</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .switch-button {
            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-align: center;
            align-items: center;
            -webkit-box-pack: center;
            justify-content: center;
            justify-content: center;
            margin: auto;
            height: 55px;
        }

        .switch-button .switch-outer {
            height: 100%;
            background: #252532;
            width: 400px;
            border-radius: 165px;
            -webkit-box-shadow: inset 0px 5px 10px 0px #16151c, 0px 3px 6px -2px #403f4e;
            box-shadow: inset 0px 5px 10px 0px #16151c, 0px 3px 6px -2px #403f4e;
            border: 1px solid #32303e;
            padding: 6px;
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .switch-button .switch-outer input[type="checkbox"] {
            opacity: 0;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            position: absolute;
        }

        .switch-button .switch-outer .button-toggle {
            height: 42px;
            width: 42px;
            background: -webkit-gradient(linear,
                    left top,
                    left bottom,
                    from(#3b3a4e),
                    to(#272733));
            background: -o-linear-gradient(#3b3a4e, #272733);
            background: linear-gradient(#3b3a4e, #272733);
            border-radius: 100%;
            -webkit-box-shadow: inset 0px 5px 4px 0px #424151, 0px 4px 15px 0px #0f0e17;
            box-shadow: inset 0px 5px 4px 0px #424151, 0px 4px 15px 0px #0f0e17;
            position: relative;
            z-index: 2;
            -webkit-transition: left 0.3s ease-in;
            -o-transition: left 0.3s ease-in;
            transition: left 0.3s ease-in;
            left: 0;
        }

        .switch-button .switch-outer input[type="checkbox"]:checked+.button .button-toggle {
            left: 88%;
        }

        .switch-button .switch-outer input[type="checkbox"]:checked+.button .button-indicator {
            -webkit-animation: indicator 1s forwards;
            animation: indicator 1s forwards;
        }

        .switch-button .switch-outer .button {
            width: 100%;
            height: 100%;
            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;
            position: relative;
            -webkit-box-pack: justify;
            justify-content: space-between;
        }

        .switch-button .switch-outer .button-indicator {
            height: 25px;
            width: 25px;
            top: 50%;
            -webkit-transform: translateY(-50%);
            transform: translateY(-50%);
            border-radius: 50%;
            border: 3px solid #ef565f;
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
            right: 10px;
            position: relative;
        }

        @-webkit-keyframes indicator {
            30% {
                opacity: 0;
                -webkit-transform: translateX(0);
            }

            0% {
                opacity: 1;
                -webkit-transform: translateX(0);
            }

            100% {
                opacity: 1;
                border: 3px solid #60d480;
                -webkit-transform: translateX(-88%);
            }
        }

        @keyframes indicator {
            30% {
                opacity: 0;
                transform: translateX(0);
            }

            0% {
                opacity: 1;
                transform: translateX(0);
            }

            100% {
                opacity: 1;
                border: 3px solid #60d480;
                transform: translateX(-88%);
            }
        }
    </style>
</head>

<body>
    <header class="bg-black fixed top-0 left-0 h-16 z-50 w-full border-b-2 p-2">
        <div class="flex justify-between">
            <button type="button" id="sidebarToggle"
                onclick="document.getElementById('sidebar').classList.toggle('hidden')"
                class="mr-4 text-2xl hover:text-cyan-800 rounded-lg p-1 border-b-4 border-red-500 bg-blue-500 font-bold shadow-lg">≡</button>
            <h1 class="text-xl font-bold neon-glow rounded-lg p-2 cursor-pointer">aaa<span class="text-cyan-400"></span>
            </h1>


            <div class="flex space-x-6 justify-between">
                <div id="sbutton">
                    <div class="flex items-center justify-center space-x-6">
                        <label class="switch-button" for="switch">
                            <div class="switch-outer">
                                <input id="switch" type="checkbox">
                                <div class="button">
                                    <span class="button-toggle"></span>
                                    <span class="button-indicator"></span>
                                </div>
                            </div>
                        </label>
                    </div>
                </div>

                <div
                    class="w-8 h-8 rounded-full bg-gradient-to-r from-cyan-400 to-purple-500 flex items-center justify-center cursor-pointer pulse">
                    <span class="text-sm font-bold">JB</span>
                </div>
            </div>
        </div>
    </header>




    <script>
        // JavaScript to handle the request sending and response display
        document.querySelector('.bg-cyan-500').addEventListener('click', function () {
            const requestData = document.getElementById('textInput').value;
            const responseData = `Response for: ${requestData}`;
            document.querySelector('.request-data').textContent = requestData;
            document.querySelector('.response-data').textContent = responseData;
        });

        document.querySelector('.bg-gray-700').addEventListener('click', function () {
            document.getElementById('textInput').value = '';
            document.querySelector('.request-data').textContent = 'Request Data will appear here...';
            document.querySelector('.response-data').textContent = 'Response Data will appear here...';
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
</body>

</html>
