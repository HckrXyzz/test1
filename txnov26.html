    const tableBody = document.getElementById('tableBody');
    const rowCount = document.getElementById('rowCount');
    const totalAmount = document.getElementById('totalAmount');
    const searchInput = document.getElementById('searchInput');

    function parseNum(val) {
      return Number(String(val).replace(/,/g, '')) || 0;
    }

    function renderTable(data) {
      rowCount.textContent = data.length;
      const sum = data.reduce((acc, item) => acc + parseNum(item.amount), 0);
      totalAmount.textContent = sum.toLocaleString('en-US');

      tableBody.innerHTML = data.map((row, idx) => `
        <tr class="hover:bg-gray-800/50 transition-colors group">
          <td class="py-3 px-4 text-center text-xs font-mono text-slate-500">${idx + 1}</td>
          <td class="py-3 px-4 font-mono font-medium text-slate-200 tx select-all"><button type="button" class="text-blue-400 txBtn copyBtn" copy-data="${row.tx}" id="tx-${row.tx}">${row.tx}</button></td>
          <td class="py-3 px-4 text-right font-mono font-semibold text-emerald-400 amount">${row.amount}</td>
          <td class="py-3 px-4 text-right">
            ${
              row.url
                ? `<a href="${row.url}" target="_blank" rel="noopener noreferrer" class="redirect imageLink inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 hover:bg-indigo-500/20 hover:text-indigo-300 transition">View image ↗</a>`
                : `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20">Incomplete link</span>`
            }
          </td>
        </tr>
      `).join('');
    }

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtered = transactions.filter(item =>
        item.tx.toLowerCase().includes(q) || item.amount.toLowerCase().includes(q)
      );
      renderTable(filtered);
    });

    renderTable(transactions);
  </script>
