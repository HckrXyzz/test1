<!doctype html>
<html lang="en">
  <head>

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
   
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap");

      :root {
        --neon-pink: #ff00ff;
        --neon-blue: #00ffff;
        --neon-purple: #9d00ff;
        --neon-green: #00ff9d;
        --dark-bg: #0f0f1a;
      }

      body {
        font-family: "Quicksand", sans-serif;
        background-color: var(--dark-bg);
        color: white;
        overflow-x: hidden;
      }

      .neon-glow {
        text-shadow:
          0 0 5px #fff,
          0 0 10px #fff,
          0 0 15px cyan,
          0 0 20px cyan;
      }

      .shadow {
        color: #0e1013;
        text-shadow: 1px 1px 5px #fff;
      }

      .sidebar {
        transition: transform 0.3s ease-out;
        transform: translateX(-100%);
        position: fixed;
        top: 0;
        left: 0;
        width: 180px;
        height: 100%;
        overflow-y: auto;
        scroll-behavior: smooth;
        z-index: 100;
      }

      .input-container {
        display: flex;
        background: white;
        border-radius: 1rem;
        background: linear-gradient(135deg, #23272f 0%, #14161a 100%);
        box-shadow:
          10px 10px 20px #0e1013,
          -10px -10px 40px #383e4b;
        padding: 0.3rem;
        gap: 0.3rem;
      }

      .input-container input {
        border-radius: 0.8rem 0 0 0.8rem;
        background: #23272f;
        box-shadow:
          inset 5px 5px 10px #0e1013,
          inset -5px -5px 10px #383e4b,
          0px 0px 100px rgba(255, 212, 59, 0),
          0px 0px 100px rgba(255, 102, 0, 0);
        width: 100%;
        flex-basis: 75%;
        padding: 1rem;
        border: none;
        border: 1px solid transparent;
        color: white;
        transition: all 0.2s ease-in-out;
      }

      .input-container input:focus {
        border: 1px solid #ffd43b;
        outline: none;
        box-shadow:
          inset 0px 0px 10px rgba(255, 102, 0, 0.5),
          inset 0px 0px 10px rgba(255, 212, 59, 0.5),
          0px 0px 100px rgba(255, 212, 59, 0.5),
          0px 0px 100px rgba(255, 102, 0, 0.5);
      }

      .input-container button {
        flex-basis: 25%;
        padding: 1rem;
        background: linear-gradient(
          135deg,
          rgb(255, 212, 59) 0%,
          rgb(255, 102, 0) 100%
        );
        box-shadow:
          0px 0px 1px rgba(255, 212, 59, 0.5),
          0px 0px 1px rgba(255, 102, 0, 0.5);
        font-weight: 900;
        letter-spacing: 0.3rem;
        text-transform: uppercase;
        color: #23272f;
        border: none;
        width: 100%;
        border-radius: 0 1rem 1rem 0;
        transition: all 0.2s ease-in-out;
      }

      .input-container button:hover {
        background: linear-gradient(
          135deg,
          rgb(255, 212, 59) 50%,
          rgb(255, 102, 0) 100%
        );
        box-shadow:
          0px 0px 100px rgba(255, 212, 59, 0.5),
          0px 0px 100px rgba(255, 102, 0, 0.5);
      }

      @media (max-width: 500px) {
        .input-container {
          flex-direction: column;
        }

        .input-container input {
          border-radius: 0.8rem;
        }

        .input-container button {
          padding: 1rem;
          border-radius: 0.8rem;
        }
      }

      .xxx {
        color: #ffffff;
      }

      .neon-glow {
        box-shadow:
          0px 0px 100px rgba(255, 212, 59, 0.5),
          0px 0px 100px rgba(255, 102, 0, 0.5);
        text-shadow:
          0px 0px 100px rgba(23, 22, 16, 0.5),
          0px 0px 100px rgba(118, 111, 106, 0.5);
      }

      .text-shadow {
        text-shadow:
          0px 0px 100px rgb(148, 148, 148),
          0px 0px 100px rgba(153, 151, 150, 0.5);
      }

      .neon-box {
        box-shadow:
          0px 0px 100px rgba(255, 212, 59, 0.5),
          0px 0px 100px rgba(255, 102, 0, 0.5);
        text-shadow:
          0px 0px 100px rgba(255, 212, 59, 0.5),
          0px 0px 100px rgba(255, 102, 0, 0.5);
      }

      .neon-pink {
        box-shadow:
          0 0 5px var(--neon-pink),
          0 0 15px var(--neon-pink);
      }

      .neon-purple {
        box-shadow:
          0 0 5px var(--neon-purple),
          0 0 15px var(--neon-purple);
      }

      .neon-green {
        box-shadow:
          0 0 5px var(--neon-green),
          0 0 15px var(--neon-green);
      }

      .sidebar {
        background: rgba(15, 15, 26, 0.9);
        -webkit-backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border-right: 1px solid rgba(0, 255, 255, 0.2);
        transition: all 0.3s ease;
      }

      .sidebar-item {
        transition: all 0.3s ease;
        border-left: 3px solid transparent;
      }

      .sidebar-item:hover,
      .sidebar-item.active {
        background: rgba(0, 255, 255, 0.1);
        border-left: 3px solid var(--neon-blue);
      }

      .header {
        background: rgba(15, 15, 26, 0.8);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(0, 255, 255, 0.2);
      }

      .search-bar {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(0, 255, 255, 0.3);
        transition: all 0.3s ease;
      }

      .search-bar:focus {
        box-shadow:
          0 0 5px var(--neon-blue),
          0 0 15px var(--neon-blue);
        border: 1px solid var(--neon-blue);
      }

      .content-section {
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.5s ease;
        display: none;
      }

      .content-section.active {
        opacity: 1;
        transform: translateY(0);
        display: block;
      }

      .clock {
        font-weight: 300;
        letter-spacing: 1px;
      }

      @keyframes pulse {
        0% {
          box-shadow:
            0 0 5px var(--neon-blue),
            0 0 10px var(--neon-blue);
        }

        50% {
          box-shadow:
            0 0 10px var(--neon-blue),
            0 0 20px var(--neon-blue);
        }

        100% {
          box-shadow:
            0 0 5px var(--neon-blue),
            0 0 10px var(--neon-blue);
        }
      }

      .pulse {
        animation: pulse 2s infinite;
      }

      .textarea-neon,
      .file-input-label {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(0, 255, 255, 0.3);
        transition: all 0.3s ease;
      }

      .textarea-neon:focus {
        box-shadow:
          0 0 5px var(--neon-blue),
          0 0 15px var(--neon-blue);
        border: 1px solid var(--neon-blue);
      }

      .file-input {
        display: none;
      }

      .file-input-label:hover {
        box-shadow:
          0 0 5px var(--neon-purple),
          0 0 15px var(--neon-purple);
        border: 1px solid var(--neon-purple);
      }

      .notification-badge {
        background-color: var(--neon-pink);
        position: absolute;
        top: -5px;
        right: -5px;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-50px) scale(0.9);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      .popup-overlay {
        animation: fadeIn 0.3s ease-out;
      }

      .popup-card {
        animation: slideIn 0.4s ease-out;
      }

      .xxx-card:hover {
        transform: translateY(-2px);
        transition: all 0.3s ease;
      }

      .gradient-bg {
        background: linear-gradient(135deg, #23272f 0%, #14161a 100%);
      }

      .card-gradient {
        background: linear-gradient(135deg, #23272f 0%, #14161a 100%);
      }

      .owner-gradient {
        background: linear-gradient(135deg, #23272f 0%, #14161a 100%);
      }

      .wallet-gradient {
        background: linear-gradient(135deg, #23272f 0%, #14161a 100%);
      }

      .usage-gradient {
        background: linear-gradient(
          135deg,
          rgb(255, 212, 59) 0%,
          rgb(255, 102, 0) 100%
        );
      }
    </style>
  </head>

    <main
      class="pt-20 pb-8 px-4 md:px-8 ml-0 md:ml-64 transition-all duration-300"
    >

            oninput="searchxxxs()"

            class="w-full p-3 rounded-l-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
          <button type="button" class="button">Search</button>
        </div>

    </main>

    <!-- Add New xxx Button -->

      <button
        type="button"
        onclick="showAddForm()"

        ➕ Add

        <!-- xxx cards will be populated here -->

        </p>

    <!-- Add/Edit Form Modal -->
    <div
      id="formModal"
      class="fixed inset-0 bg-black bg-opacity-50 hidden popup-overlay z-50"
    >
      <div class="flex items-center justify-center min-h-screen p-4">
        <div
          class="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-screen overflow-y-auto popup-card"
        >
          <div class="bg-black text-white p-6 rounded-t-xl">
            <h2 id="formTitle" class="text-2xl font-bold">Add New</h2>
          </div>

          <form id="xxxForm" class="p-6 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2"

                >
                <input
                  type="text"
                  id="xxxNumber"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2"

                >
                <input
                  type="text"
                  id="pinCode"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>

                <label class="block text-sm font-medium text-gray-700 mb-2"

              </div>

                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2"

                >
                <input
                  type="text"
                  id="idCard"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2"

                <input
                  type="text"
                  id="reference"

                />
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Address *</label
