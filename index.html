              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>

                  />
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2"
                    >Owner Name *</label
                  >
                  <input
                    type="text"
                    id="ownerName"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2"
                    >ID Card Number *</label
                  >
                  <input
                    type="text"
                    id="idCard"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2"
                    >Reference</label
                  >
                  <input
                    type="text"
                    id="reference"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2"
                  >Address *</label
                >
                <textarea
                  id="address"
                  rows="3"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                ></textarea>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2"
                    >Wallet Balance</label
                  >
                  <input
                    type="number"
                    id="walletBalance"
                    step="0.01"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2"
                    >Data Usage (GB)</label
                  >
                  <input
                    type="number"
                    id="dataUsage"
                    step="0.1"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>
              </div>

              <div class="flex justify-end space-x-4 pt-4">
                <button

                  onclick="hideForm()"
                  class="px-4 py-2 border bg-red-600 border-gray-300 rounded-lg hover:bg-gray-500"

                <button
                  type="submit"
                  class="px-6 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg transition-colors"

                  Save xxx Card
